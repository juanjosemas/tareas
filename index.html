<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>  
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&displayfamily=Amatic+SC:wght@700&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Lobster&family=Metal+Mania&family=Yellowtail& family=Permanent+Marker&family=Piedra&family=Sriracha&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
  <!-- Overlay que oscurece el fondo cuando el menú está abierto -->
  <div id="overlay"></div>

  <!-- Panel del menú lateral -->
  <nav id="side-menu">
      <div class="menu-header">Menú</div>
      <ul>
          <li><button id="boton-ir-a-papelera"><i class="fas fa-trash-alt"></i> Papelera</button></li>
          <li><button id="boton-limpiar-completadas"><i class="fas fa-check-double"></i> Limpiar Completadas</button></li>
          <li><button id="boton-ir-a-configuracion"><i class="fas fa-cog"></i> Configuración</button></li>
      </ul>
  </nav>

  <!-- Contenedor principal de la aplicación -->
  <div class="container">
    <div class="header">
        <div class="header-title-container">
            <div id="menu-trigger-icon" title="Abrir menú">
                <img src="img/Juanjo.ico" class="ico">
            </div>
            <h1>Lista de tareas</h1>
        </div>
    </div>
  
    <br>
     
    <div class="perfil"> </div> 
   
    <!-- Vista Principal: donde se añaden y se ven las tareas -->
    <div id="vista-principal">
        <div class="agregar-tarea">
            <input type="text" id="input" placeholder="Nueva tarea">
            <i id="boton-enter" class="fas fa-check-circle"></i>
            <button id="boton-grabar-voz" title="Agregar producto por voz">
                <i class="fas fa-microphone"></i>
            </button>
        </div> 

        <br>
        
        <div class="seccion-tarea">
            <ul id="lista"></ul>
            <div id="mensaje-lista-vacia" class="hidden">
                <p>¡No hay tareas pendientes! Añade una para empezar.</p>
            </div>
        </div>   
    </div>

    <!-- Vista de la Papelera: Muestra las tareas eliminadas -->
    <div id="vista-papelera" class="hidden">
        <div class="seccion-papelera">
            <div class="papelera-header">
                <button class="boton-volver-lista" title="Volver a la lista">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <h2>Papelera</h2>
                <button id="boton-vaciar-papelera" title="Vaciar toda la papelera">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <ul id="papelera-lista"></ul>
            <div id="mensaje-papelera-vacia" class="hidden">
                <p>La papelera está vacía.</p>
            </div>
        </div>
    </div>

    <!-- Vista de Configuración: Contiene las opciones de la aplicación -->
    <div id="vista-configuracion" class="hidden">
        <div class="seccion-configuracion">
             <div class="config-header">
                <button class="boton-volver-lista" title="Volver a la lista">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <h2>Configuración</h2>
                <div style="width: 80px;"></div> 
            </div>
            <div class="config-options">
                
                <div class="setting-item">
                    <span>Modo Oscuro</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="theme-toggle-switch">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- COMENTARIO: Selector de color con los nuevos temas actualizados -->
                <div class="setting-item">
                    <span>Color de Tareas</span>
                    <div id="task-color-selector" class="color-selector">
                        <label>
                            <!-- El valor ahora es "blue" para el azul fuerte -->
                            <input type="radio" name="task-color" value="blue" checked>
                            <span class="color-dot blue"></span>
                        </label>
                        <label>
                            <input type="radio" name="task-color" value="red">
                            <span class="color-dot red"></span>
                        </label>
                        <label>
                            <input type="radio" name="task-color" value="yellow">
                            <span class="color-dot yellow"></span>
                        </label>
                        <label>
                            <!-- El valor ahora es "lightgreen" para el nuevo verde claro -->
                            <input type="radio" name="task-color" value="lightgreen">
                            <span class="color-dot lightgreen"></span>
                        </label>
                    </div>
                </div>

                 <div class="setting-item">
                    <span>Tamaño del Texto</span>
                    <div class="font-size-control">
                        <span>A</span>
                        <input type="range" id="font-size-slider" min="0.9" max="1.5" step="0.1">
                        <span>A</span>
                    </div>
                </div>

                <div class="setting-item">
                    <span>Animaciones</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="animations-toggle-switch">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <span>Pedir confirmación al borrar</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="confirmations-toggle-switch">
                        <span class="slider"></span>
                    </label>
                </div>

            </div>
        </div>
    </div>
 
  </div>
    
  <!-- Contenedor de notificaciones que aparece en la parte inferior -->
  <div id="notification-container">
      <span id="notification-message"></span>
      <button id="undo-button" class="hidden">Deshacer</button>
  </div>

<script src="script.js"></script>
</body>
</html>
